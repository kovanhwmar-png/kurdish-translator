<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>وەرگێڕی ژیر بۆ کوردی</title>
 <script src="https://cdn.tailwindcss.com"></script>
 <style>
 @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;500;600;700&display=swap');
 * { font-family: 'Noto Sans Arabic', sans-serif; }
 body { background: linear-gradient(135deg, #0F172A 0%, #1E1B4B 100%); }
 .glow { box-shadow: 0 0 20px rgba(139, 92, 246, 0.3); }
 .pulse-dot { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
 @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
 .drawer { transform: translateX(100%); transition: transform 0.3s ease; }
 .drawer.open { transform: translateX(0); }
 </style>
</head>
<body class="min-h-screen text-slate-100">
 <header class="border-b border-slate-700/50 backdrop-blur-sm bg-slate-900/50 sticky top-0 z-50">
 <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
 <div class="flex items-center gap-3">
 <div class="w-10 h-10 bg-gradient-to-br from-violet-500 to-purple-600 rounded-lg flex items-center justify-center text-xl">✦</div>
 <div>
 <h1 class="text-xl font-bold">وەرگێڕی ژیر</h1>
 <div class="flex items-center gap-2 text-xs text-slate-400">
 <span class="w-2 h-2 bg-green-500 rounded-full pulse-dot"></span>
 <span>٣٢٧ بەکارهێنەر ئۆنلاین</span>
 </div>
 </div>
 </div>
 <div class="flex items-center gap-3">
 <button onclick="toggleDrawer()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-sm transition">
 ☰ مێژوو
 </button>
 <button class="px-4 py-2 bg-violet-600 hover:bg-violet-700 rounded-lg text-sm transition">
 🔐 چوونەژوورەوە
 </button>
 </div>
 </div>
 </header>

 <div id="drawer" class="drawer fixed top-0 right-0 h-full w-80 bg-slate-900 border-l border-slate-700 z-50 p-6 overflow-y-auto">
 <div class="flex justify-between items-center mb-6">
 <h2 class="text-lg font-bold">مێژووی وەرگێڕان</h2>
 <button onclick="toggleDrawer()" class="text-2xl hover:text-violet-400">×</button>
 </div>
 <div id="history" class="space-y-3 text-sm text-slate-300">
 <p class="text-center text-slate-500 mt-10">هێشتا مێژوویەک نییە</p>
 </div>
 </div>

 <main class="max-w-4xl mx-auto px-4 py-12">
 <div class="text-center mb-12">
 <h2 class="text-5xl font-bold mb-4 bg-gradient-to-r from-violet-400 to-purple-300 bg-clip-text text-transparent">
 وەرگێڕی ژیری دەستکرد بۆ کوردی
 </h2>
 <p class="text-slate-400 text-lg">بە تێگەیشتنی قووڵ و دەقیقی فەرهەنگی</p>
 </div>

 <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
 <div>
 <label class="block text-sm font-medium mb-2 text-slate-300">زمانی سەرچاوە</label>
 <select id="sourceLang" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 focus:ring-2 focus:ring-violet-500 focus:outline-none">
 <option value="en">🇬🇧 English - ئینگلیزی</option>
 <option value="ar">🇸🇦 العربية - عەرەبی</option>
 </select>
 </div>
 <div>
 <label class="block text-sm font-medium mb-2 text-slate-300">شێوازی دەربڕین</label>
 <select id="tone" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 focus:ring-2 focus:ring-violet-500 focus:outline-none">
 <option value="natural">💬 سروشتی</option>
 <option value="formal">📜 فەرمی</option>
 <option value="street">🎤 کۆڵان</option>
 <option value="literary">✍️ ئەدەبی</option>
 </select>
 </div>
 </div>

 <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 mb-6">
 <div class="flex justify-between items-center mb-3">
 <span class="text-sm font-medium text-slate-400">دەقی وەرگێڕدراو</span>
 <div class="flex gap-2">
 <button onclick="pasteText()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs transition" title="پەست">📋</button>
 <button onclick="clearInput()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs transition" title="سڕینەوە">🗑️</button>
 </div>
 </div>
 <textarea 
 id="inputText" 
 rows="6" 
 class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 focus:ring-2 focus:ring-violet-500 focus:outline-none resize-none"
 placeholder="دەقەکەت لێرە بنووسە یان پەیستی بکە..."
 ></textarea>
 </div>

 <button 
 onclick="translate()" 
 id="translateBtn"
 class="w-full bg-gradient-to-r from-violet-600 to-purple-600 hover:from-violet-700 hover:to-purple-700 text-white font-bold py-5 rounded-xl text-lg transition glow mb-6"
 >
 وەرگێڕان بە تێگەیشتنی قووڵ ✦
 </button>

 <div id="resultBox" class="bg-slate-800 border border-slate-700 rounded-xl p-6 hidden">
 <div class="flex justify-between items-center mb-4">
 <span class="text-sm font-medium text-slate-400">دەرئەنجامی کوردی</span>
 <div class="flex gap-2">
 <button onclick="copyResult()" class="px-3 py-1.5 bg-violet-600 hover:bg-violet-700 rounded-lg text-xs transition">📄 کۆپی</button>
 <button onclick="speakResult()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs transition">🔊 دەنگ</button>
 </div>
 </div>
 <div id="result" class="text-lg leading-relaxed text-slate-100 min-h-[100px]"></div>
 </div>

 <div id="loading" class="hidden text-center py-8">
 <div class="inline-block w-12 h-12 border-4 border-violet-500 border-t-transparent rounded-full animate-spin"></div>
 <p class="mt-4 text-slate-400">چاوەڕوانبە، وەرگێڕانی دەقەکە...</p>
 </div>
 </main>

 <script>
 let historyItems = [];
 function toggleDrawer() {
 document.getElementById('drawer').classList.toggle('open');
 }
 async function translate() {
 const text = document.getElementById('inputText').value.trim();
 const sourceLang = document.getElementById('sourceLang').value;
 const tone = document.getElementById('tone').value;
 if (!text) {
 alert('تکایە دەقێک بنووسە');
 return;
 }
 document.getElementById('translateBtn').disabled = true;
 document.getElementById('loading').classList.remove('hidden');
 document.getElementById('resultBox').classList.add('hidden');
 try {
 const response = await fetch('/api/translate', {
 method: 'POST',
 headers: { 'Content-Type': 'application/json' },
 body: JSON.stringify({ text, sourceLang, tone })
 });
 if (!response.ok) throw new Error('هەڵەیەک ڕوویدا');
 const translation = await response.text();
 document.getElementById('result').textContent = translation;
 document.getElementById('resultBox').classList.remove('hidden');
 historyItems.unshift({ text: text.substring(0, 50) + '...', translation: translation.substring(0, 50) + '...', time: new Date().toLocaleTimeString('ar-IQ') });
 updateHistory();
 } catch (error) {
 alert('هەڵەیەک ڕوویدا، تکایە دووبارە هەوڵ بدەرەوە');
 } finally {
 document.getElementById('translateBtn').disabled = false;
 document.getElementById('loading').classList.add('hidden');
 }
 }
 function updateHistory() {
 const historyEl = document.getElementById('history');
 if (historyItems.length === 0) {
 historyEl.innerHTML = '<p class="text-center text-slate-500 mt-10">هێشتا مێژوویەک نییە</p>';
 } else {
 historyEl.innerHTML = historyItems.map((item, i) => `
 <div class="bg-slate-800 rounded-lg p-3 border border-slate-700">
 <div class="text-xs text-slate-500 mb-1">${item.time}</div>
 <div class="text-slate-300">${item.translation}</div>
 </div>
 `).join('');
 }
 }
 async function pasteText() {
 try {
 const text = await navigator.clipboard.readText();
 document.getElementById('inputText').value = text;
 } catch (err) {
 alert('تکایە مۆڵەت بدە بۆ پەیست کردن');
 }
 }
 function clearInput() {
 document.getElementById('inputText').value = '';
 }
 function copyResult() {
 const text = document.getElementById('result').textContent;
 navigator.clipboard.writeText(text).then(() => {
 alert('کۆپی کرا!');
 });
 }
 function speakResult() {
 const text = document.getElementById('result').textContent;
 const utterance = new SpeechSynthesisUtterance(text);
 utterance.lang = 'ar-IQ';
 speechSynthesis.speak(utterance);
 }
 document.addEventListener('click', (e) => {
 const drawer = document.getElementById('drawer');
 if (drawer.classList.contains('open') && !drawer.contains(e.target) && !e.target.closest('button[onclick="toggleDrawer()"]')) {
 drawer.classList.remove('open');
 }
 });
 </script>
</body>
</html>
