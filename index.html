<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kurd AI Translate (KAT) | وەرگێڕی ژیری دەستکردی کوردی</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Vazirmatn', sans-serif; background: #0f172a; color: #f8fafc; }
    .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 md:p-8">

  <!-- Header -->
  <header class="max-w-4xl mx-auto w-full flex justify-between items-center mb-6">
    <div>
      <h1 class="text-2xl md:text-3xl font-black bg-gradient-to-r from-purple-400 via-pink-400 to-indigo-400 bg-clip-text text-transparent">
        Kurd AI Translate (KAT)
      </h1>
      <p class="text-xs md:text-sm text-slate-400 mt-1">وەرگێڕی زیرەکی هەموو شێوەزارەکانی کوردی بۆ ئینگلیزی و بەپێچەوانەوە</p>
    </div>
    <div class="flex items-center space-x-2 space-x-reverse bg-slate-800/80 px-3 py-1.5 rounded-full border border-slate-700 text-xs text-emerald-400 font-medium">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
      <span>سیستەم ئامادەیە</span>
    </div>
  </header>

  <!-- Main App Card -->
  <main class="max-w-4xl mx-auto w-full glass-card rounded-3xl p-5 md:p-8 shadow-2xl flex-1 flex flex-col justify-center">

    <!-- Controls Bar -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
      <!-- ئاڕاستەی وەرگێڕان -->
      <div>
        <label class="block text-xs text-slate-400 mb-1.5">ئاڕاستەی وەرگێڕان:</label>
        <select id="directionSelect" class="w-full bg-slate-800 text-white rounded-xl px-4 py-2.5 text-sm border border-slate-700 focus:outline-none focus:border-purple-500">
          <option value="ku-to-en" selected>کوردی (هەموو شێوەزارەکان) ⬅️ ئینگلیزی</option>
          <option value="en-to-ku">ئینگلیزی ⬅️ کوردی (سۆرانی/بادینی)</option>
        </select>
      </div>

      <!-- شێوازی دەربڕین -->
      <div>
        <label class="block text-xs text-slate-400 mb-1.5">شێوازی دەربڕین (Tone):</label>
        <select id="toneSelect" class="w-full bg-slate-800 text-white rounded-xl px-4 py-2.5 text-sm border border-slate-700 focus:outline-none focus:border-purple-500">
          <option value="natural" selected>سروشتی و بازاڕی (گفتوگۆیی)</option>
          <option value="formal">فەرمی و ئەکادیمی</option>
          <option value="street">کۆڵانی و سلانگ (زۆر شەعبی)</option>
          <option value="literary">ئەدەبی و شاعیرانە</option>
        </select>
      </div>
    </div>

    <!-- Inputs & Outputs -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-6">
      <!-- Input -->
      <div class="flex flex-col">
        <div class="flex justify-between items-center mb-2">
          <span id="inputLabel" class="text-xs font-semibold text-purple-300">دەقی کوردی (سۆرانی، بادینی، بازاڕی...):</span>
          <button id="clearBtn" class="text-xs text-slate-400 hover:text-red-400 transition">سڕینەوە 🗑️</button>
        </div>
        <textarea id="inputText" rows="6" placeholder="هەر دەقێک بە هەولێری، سلێمانی یان بادینی بنووسە..." class="w-full bg-slate-900/90 text-white rounded-2xl p-4 text-sm border border-slate-700/80 focus:outline-none focus:border-purple-500 resize-none transition"></textarea>
      </div>

      <!-- Output -->
      <div class="flex flex-col">
        <div class="flex justify-between items-center mb-2">
          <span id="outputLabel" class="text-xs font-semibold text-pink-300">ئەنجامی ئینگلیزی:</span>
          <button id="copyBtn" class="text-xs text-slate-400 hover:text-purple-300 transition">کۆپی 📋</button>
        </div>
        <div id="outputText" class="w-full h-full min-h-[144px] bg-slate-900/50 rounded-2xl p-4 text-sm border border-slate-800 text-slate-200 overflow-y-auto whitespace-pre-wrap select-all"></div>
      </div>
    </div>

    <!-- Translate Button -->
    <button id="translateBtn" class="w-full py-4 rounded-2xl bg-gradient-to-r from-purple-600 via-indigo-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-bold text-base shadow-lg hover:shadow-purple-500/25 transition-all duration-300 flex items-center justify-center space-x-2 space-x-reverse">
      <span id="btnSpinner" class="hidden inline-block w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
      <span id="btnText">✨ وەرگێڕان بە ژیریی دەستکرد</span>
    </button>

  </main>

  <!-- Footer -->
  <footer class="max-w-4xl mx-auto w-full text-center py-4 text-xs text-slate-500">
    Kurd AI Translate (KAT) © پڕۆژەی وەرگێڕانی زیرەکی کوردی
  </footer>

  <script>
    const directionSelect = document.getElementById('directionSelect');
    const toneSelect = document.getElementById('toneSelect');
    const inputText = document.getElementById('inputText');
    const outputText = document.getElementById('outputText');
    const inputLabel = document.getElementById('inputLabel');
    const outputLabel = document.getElementById('outputLabel');
    const translateBtn = document.getElementById('translateBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    const clearBtn = document.getElementById('clearBtn');
    const copyBtn = document.getElementById('copyBtn');

    directionSelect.addEventListener('change', () => {
      if (directionSelect.value === 'ku-to-en') {
        inputLabel.innerText = 'دەقی کوردی (سۆرانی، بادینی، بازاڕی...):';
        outputLabel.innerText = 'ئەنجامی ئینگلیزی:';
        inputText.placeholder = 'هەر دەقێک بە هەولێری، سلێمانی یان بادینی بنووسە...';
        inputText.dir = 'rtl';
        outputText.dir = 'ltr';
      } else {
        inputLabel.innerText = 'دەقی ئینگلیزی (English):';
        outputLabel.innerText = 'ئەنجامی کوردی:';
        inputText.placeholder = 'Type English text here...';
        inputText.dir = 'ltr';
        outputText.dir = 'rtl';
      }
    });

    clearBtn.addEventListener('click', () => {
      inputText.value = '';
      outputText.innerText = '';
    });

    copyBtn.addEventListener('click', () => {
      if (outputText.innerText) {
        navigator.clipboard.writeText(outputText.innerText);
        alert('کۆپی کرا!');
      }
    });

    translateBtn.addEventListener('click', async () => {
      const text = inputText.value.trim();
      if (!text) {
        alert('تکایە سەرەتا دەقێک بنووسە!');
        return;
      }

      translateBtn.disabled = true;
      btnSpinner.classList.remove('hidden');
      btnText.innerText = 'لە وەرگێڕاندایە...';
      outputText.innerText = 'کەمێک چاوەڕێ بکە...';

      try {
        const response = await fetch('/.netlify/functions/translate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            text: text,
            direction: directionSelect.value,
            tone: toneSelect.value
          })
        });

        const data = await response.text();
        outputText.innerText = data;
      } catch (err) {
        outputText.innerText = 'هەڵەی پەیوەندی ڕوویدا: ' + err.message;
      } finally {
        translateBtn.disabled = false;
        btnSpinner.classList.add('hidden');
        btnText.innerText = '✨ وەرگێڕان بە ژیریی دەستکرد';
      }
    });
  </script>
</body>
</html>
