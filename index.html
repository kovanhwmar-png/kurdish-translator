<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>وەرگێڕی ژیر بۆ کوردی</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;500;600;700&display=swap');
    * { font-family: 'Noto Sans Arabic', sans-serif; }
    body { background: linear-gradient(135deg, #0F172A 0%, #1E1B4B 100%); }
    .glow { box-shadow: 0 0 20px rgba(139, 92, 246, 0.3); }
    .pulse-dot { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    .drawer { transform: translateX(100%); transition: transform 0.3s ease; }
    .drawer.open { transform: translateX(0); }
  </style>
</head>
<body class="min-h-screen text-slate-100 flex flex-col justify-between">

  <!-- سەرپەڕە -->
  <header class="border-b border-slate-700/50 backdrop-blur-sm bg-slate-900/50 sticky top-0 z-40">
    <div class="max-w-4xl mx-auto px-4 py-3.5 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-gradient-to-br from-violet-500 to-purple-600 rounded-xl flex items-center justify-center text-xl shadow-lg shadow-purple-500/20">✦</div>
        <div>
          <h1 class="text-lg font-bold">وەرگێڕی ژیر</h1>
          <div class="flex items-center gap-2 text-xs text-slate-400">
            <span class="w-2 h-2 bg-emerald-500 rounded-full pulse-dot"></span>
            <span>سیستەم ئامادەیە</span>
          </div>
        </div>
      </div>
      
      <!-- تەنها دوگمەی مێنیوی سێ خەت -->
      <button onclick="toggleDrawer()" class="p-2.5 bg-slate-800 hover:bg-slate-700 active:scale-95 rounded-xl border border-slate-700 text-slate-200 transition flex items-center justify-center" aria-label="مێنیو">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
    </div>
  </header>

  <!-- پەنجەرەی لاوەکی (Drawer) -->
  <div id="drawerBackdrop" onclick="toggleDrawer()" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden transition-opacity"></div>
  <div id="drawer" class="drawer fixed top-0 right-0 h-full w-72 bg-slate-900 border-l border-slate-800 z-50 p-6 flex flex-col justify-between">
    <div>
      <div class="flex justify-between items-center pb-4 border-b border-slate-800 mb-6">
        <h2 class="text-base font-bold text-slate-200">مێنیوی سەرەکی</h2>
        <button onclick="toggleDrawer()" class="text-2xl text-slate-400 hover:text-white leading-none">&times;</button>
      </div>

      <!-- بژاردەی چوونەژوورەوە لە ناو مێنیو -->
      <div class="mb-6">
        <button class="w-full py-3 bg-gradient-to-r from-violet-600 to-purple-600 hover:from-violet-500 hover:to-purple-500 active:scale-95 text-white font-medium rounded-xl text-sm transition shadow-lg shadow-purple-500/20 flex items-center justify-center gap-2">
          <span>چوونەژوورەوە</span>
        </button>
      </div>

      <!-- مێژووی وەرگێڕان -->
      <div>
        <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-3">مێژووی وەرگێڕان</h3>
        <div id="history" class="space-y-2.5 max-h-[50vh] overflow-y-auto pr-1">
          <p class="text-center text-slate-500 text-xs py-6">هێشتا مێژوویەک تۆمار نەکراوە</p>
        </div>
      </div>
    </div>

    <div class="pt-4 border-t border-slate-800 text-center">
      <p class="text-[11px] text-slate-500">پڕۆژەی وەرگێڕی ژیری دەستکرد</p>
    </div>
  </div>

  <!-- ناوەڕۆکی سەرەکی -->
  <main class="max-w-4xl mx-auto px-4 py-5 w-full flex-1">
    
    <div class="text-center mb-5">
      <h2 class="text-3xl md:text-5xl font-bold mb-2 bg-gradient-to-r from-violet-400 to-purple-300 bg-clip-text text-transparent">
        وەرگێڕی ژیری دەستکرد
      </h2>
      <p class="text-slate-400 text-xs md:text-sm">تێگەیشتن لە مەبەست و پەندە زمانییەکان</p>
    </div>

    <!-- هەڵبژاردنی زمان و شێوازی دەربڕین -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4">
      <div>
        <label class="block text-xs font-medium mb-1.5 text-slate-300">زمانی سەرچاوە:</label>
        <select id="sourceLang" class="w-full bg-slate-800/90 border border-slate-700 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-violet-500 focus:outline-none">
          <option value="en">🇬🇧 English - ئینگلیزی</option>
          <option value="ar">🇸🇦 العربية - عەرەبی</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-medium mb-1.5 text-slate-300">شێوازی دەربڕین:</label>
        <select id="tone" class="w-full bg-slate-800/90 border border-slate-700 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-violet-500 focus:outline-none">
          <option value="natural">💬 سروشتی</option>
          <option value="formal">📜 فەرمی</option>
          <option value="street">🎤 کۆڵان (سلانگ)</option>
          <option value="literary">✍️ ئەدەبی</option>
        </select>
      </div>
    </div>

    <!-- بۆکسی یەکەم: نووسینی دەقی سەرچاوە -->
    <div class="bg-slate-800/90 border border-slate-700 rounded-2xl p-4 mb-3">
      <div class="flex justify-between items-center mb-2">
        <span class="text-xs font-medium text-slate-400">دەقی سەرچاوە (بۆ وەرگێڕان):</span>
        <div class="flex gap-2">
          <button onclick="pasteText()" class="px-2.5 py-1 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs transition">📋 پەست</button>
          <button onclick="clearInput()" class="px-2.5 py-1 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs transition">🗑️ سڕینەوە</button>
        </div>
      </div>
      <textarea 
        id="inputText" 
        rows="5" 
        class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:ring-2 focus:ring-violet-500 focus:outline-none resize-none text-slate-100 placeholder-slate-500"
        placeholder="دەقەکەت بە ئینگلیزی یان عەرەبی لێرە بنووسە..."
      ></textarea>
    </div>

    <!-- بۆکسی دووەم: ئەنجامی کوردی (بچووکتر لە دوای بۆکسی یەکەم) -->
    <div class="bg-slate-800/80 border border-slate-700/80 rounded-2xl p-3.5 mb-4">
      <div class="flex justify-between items-center mb-2">
        <span class="text-xs font-medium text-purple-400">ئەنجامی کوردی:</span>
        <div class="flex gap-2">
          <button onclick="copyResult()" class="px-2.5 py-1 bg-violet-600 hover:bg-violet-700 rounded-lg text-xs transition">📄 کۆپی</button>
          <button onclick="speakResult()" class="px-2.5 py-1 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs transition">🔊 دەنگ</button>
        </div>
      </div>
      <div id="result" class="text-sm md:text-base leading-relaxed text-slate-200 min-h-[75px] whitespace-pre-wrap select-text bg-slate-900/90 p-3 rounded-xl border border-slate-700/60">...لێرە دەردەکەوێت</div>
    </div>

    <!-- دوگمەی وەرگێڕان: لە خوارەوەی هەردوو بۆکسەکە -->
    <button 
      onclick="translateAction()" 
      id="translateBtn"
      class="w-full bg-gradient-to-r from-violet-600 to-purple-600 hover:from-violet-700 hover:to-purple-700 text-white font-bold py-3.5 rounded-2xl text-base md:text-lg transition glow active:scale-95 flex items-center justify-center gap-2 shadow-lg shadow-purple-500/20"
    >
      <span>وەرگێڕان بە تێگەیشتنی قووڵ ✦</span>
    </button>

  </main>

  <footer class="p-3 text-center text-xs text-slate-500 border-t border-slate-800">
    پڕۆژەی وەرگێڕی ژیری دەستکرد بۆ کوردی
  </footer>

  <script>
    let historyItems = [];

    function toggleDrawer() {
      const drawer = document.getElementById('drawer');
      const backdrop = document.getElementById('drawerBackdrop');
      const isOpen = drawer.classList.contains('open');
      
      if (isOpen) {
        drawer.classList.remove('open');
        backdrop.classList.add('hidden');
      } else {
        drawer.classList.add('open');
        backdrop.classList.remove('hidden');
      }
    }

    async function translateAction() {
      const inputEl = document.getElementById('inputText');
      const resultEl = document.getElementById('result');
      const btn = document.getElementById('translateBtn');
      const text = inputEl.value.trim();
      const sourceLang = document.getElementById('sourceLang').value;
      const tone = document.getElementById('tone').value;

      if (!text) {
        alert('تکایە سەرەتا دەقێک لە بۆکسەکە بنووسە!');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span>چاوەڕوانبە، وەرگێڕان...</span>';
      resultEl.innerText = 'لە ژێر وەرگێڕاندایە...';

      try {
        const response = await fetch('/api/translate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, sourceLang, tone })
        });

        if (!response.ok) {
          const errText = await response.text();
          throw new Error(errText || 'هەڵەی سێرڤەر');
        }

        const translation = await response.text();
        resultEl.innerText = translation;

        historyItems.unshift({
          text: text.substring(0, 35) + '...',
          translation: translation.substring(0, 35) + '...',
          time: new Date().toLocaleTimeString('ar-IQ')
        });
        updateHistory();

      } catch (error) {
        resultEl.innerText = `هەڵە: ${error.message}`;
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>وەرگێڕان بە تێگەیشتنی قووڵ ✦</span>';
      }
    }

    function updateHistory() {
      const historyEl = document.getElementById('history');
      if (historyItems.length === 0) {
        historyEl.innerHTML = '<p class="text-center text-slate-500 text-xs py-6">هێشتا مێژوویەک تۆمار نەکراوە</p>';
      } else {
        historyEl.innerHTML = historyItems.map(item => `
          <div class="bg-slate-800 rounded-xl p-2.5 border border-slate-700/70 text-xs">
            <div class="text-[11px] text-slate-400 mb-1">${item.time}</div>
            <div class="text-slate-200 line-clamp-2">${item.translation}</div>
          </div>
        `).join('');
      }
    }

    async function pasteText() {
      try {
        const text = await navigator.clipboard.readText();
        document.getElementById('inputText').value = text;
      } catch (err) {
        alert('تکایە دەستت لەسەر بۆکسەکە دابگرە و پەیست بکە.');
      }
    }

    function clearInput() {
      document.getElementById('inputText').value = '';
    }

    function copyResult() {
      const text = document.getElementById('result').innerText;
      if (text && text !== '...لێرە دەردەکەوێت') {
        navigator.clipboard.writeText(text).then(() => alert('کۆپی کرا!'));
      }
    }

    function speakResult() {
      const text = document.getElementById('result').innerText;
      if (text && text !== '...لێرە دەردەکەوێت') {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ckb';
        window.speechSynthesis.speak(utterance);
      }
    }
  </script>
</body>
</html>
