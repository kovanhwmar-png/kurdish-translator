<body class="min-h-screen flex flex-col justify-between relative overflow-x-hidden selection:bg-purple-600 selection:text-white">

    <div id="drawerBackdrop" onclick="toggleSidebar()" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 hidden transition-opacity"></div>

    <aside id="sidebarDrawer" class="fixed top-0 bottom-0 left-0 w-72 max-w-[85vw] bg-black/95 border-r border-slate-800 z-50 transform -translate-x-full transition-transform duration-300 flex flex-col justify-between p-4 shadow-2xl">
        <div class="flex flex-col h-full overflow-hidden">
            <div class="flex items-center justify-between pb-3 border-b border-slate-800/80">

            </div>

            <div id="historyActions" class="flex items-center justify-between py-1 text-xs">
                <span class="text-slate-500">دوایین وەرگێڕانەکان</span>
                <button onclick="clearHistory()" class="text-rose-400 hover:text-rose-300 flex items-center gap-1 font-medium transition-colors">
                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                    سڕینەوەی هەمووی

            </div>

            <div id="historyList" class="flex-1 overflow-y-auto custom-scrollbar flex flex-col gap-2 pr-1 py-1"></div>
            <div id="favoritesList" class="hidden flex-1 overflow-y-auto custom-scrollbar flex flex-col gap-2 pr-1 py-1"></div>

                        <img id="userAvatar" src="" class="w-8 h-8 rounded-full border border-purple-500 object-cover flex-shrink-0">
                        <span id="userName" class="text-xs font-semibold text-slate-200 truncate"></span>
                    </div>
                    <button onclick="logoutGoogle()" title="دەرچوون" class="p-1.5 text-rose-400 hover:text-rose-300 hover:bg-slate-800 rounded-lg transition-colors flex-shrink-0">
                        <i data-lucide="log-out" class="w-4 h-4"></i>
                    </button>
                </div>

                <div id="googleAuthBox" class="flex flex-col items-center">
                    <div id="g_id_onload"
                        data-client_id="339505391521-q6428177pgl0oah8m2su666mq85r4o2t.apps.googleusercontent.com"

                        data-auto_prompt="false">
                    </div>
                    <div class="g_id_signin" data-type="standard" data-size="medium" data-theme="filled_black" data-text="signin_with" data-shape="pill"></div>

    <header class="w-full px-4 h-16 flex items-center justify-between border-b border-slate-800/60 bg-slate-900/40 backdrop-blur-md sticky top-0 z-30">
        <div class="flex items-center gap-2.5">
            <button onclick="toggleSidebar()" class="p-2 text-slate-300 hover:text-white bg-slate-800/80 hover:bg-slate-700/80 rounded-xl transition-all border border-slate-700/60 active:scale-95" title="مێنۆ و مێژوو">
                <i data-lucide="menu" class="w-5 h-5"></i>

            <div class="flex items-center gap-1.5 px-2.5 py-1 bg-emerald-950/40 border border-emerald-500/30 rounded-full">

    <main class="flex-1 flex flex-col items-center justify-start p-4 w-full">
        <div class="w-full max-w-md bg-slate-900/90 border border-slate-800 rounded-3xl p-5 shadow-2xl mt-2 backdrop-blur-sm">
            <h1 class="text-2xl font-bold text-center text-purple-400 mb-1">وەرگێڕی ژیری دەستکرد</h1>
            <p class="text-xs text-center text-slate-400 mb-4">وەرگێڕانی وشەبازاڕیەکانی کوردی </p>

            <div class="mb-3">
                <label class="text-xs text-slate-400 block mb-1.5">وەرگێڕان بۆ زمانی:</label>
                <div class="grid grid-cols-2 gap-2 bg-slate-800 p-1.5 rounded-2xl border border-slate-700">
                    <button type="button" onclick="selectLang('en')" id="btn-en" class="py-2 rounded-xl text-sm font-semibold transition-all bg-purple-600 text-white shadow">ئینگلیزی (English)</button>
                    <button type="button" onclick="selectLang('ar')" id="btn-ar" class="py-2 rounded-xl text-sm font-semibold transition-all text-slate-400 hover:text-white">عەرەبی (العربية)</button>
                </div>
            </div>

            <div class="mb-3">
                <label class="text-xs text-slate-400 block mb-1.5">شێوازی دەربڕین (تۆن):</label>
                <div class="grid grid-cols-4 gap-1 bg-slate-800/80 p-1 rounded-xl border border-slate-700/80 text-[11px]">
                    <button type="button" onclick="selectTone('natural')" id="tone-natural" class="py-1.5 rounded-lg font-medium bg-purple-600 text-white transition-all">سروشتی</button>
                    <button type="button" onclick="selectTone('formal')" id="tone-formal" class="py-1.5 rounded-lg font-medium text-slate-400 hover:text-white transition-all">فەرمی</button>
                    <button type="button" onclick="selectTone('slang')" id="tone-slang" class="py-1.5 rounded-lg font-medium text-slate-400 hover:text-white transition-all">کۆڵان</button>
                    <button type="button" onclick="selectTone('poetic')" id="tone-poetic" class="py-1.5 rounded-lg font-medium text-slate-400 hover:text-white transition-all">ئەدەبی</button>
                </div>
            </div>

            <div class="mb-4 relative">
                <div class="flex items-center justify-between mb-1">
                    <label class="text-xs text-slate-400">دەقی کوردی):</label>
                    <div class="flex items-center gap-1.5">
                        <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
                        <button onclick="document.getElementById('imageInput').click()" title="وەرگێڕان لە ڕێگەی وێنەوە" class="text-emerald-400 hover:text-emerald-300 p-1 transition-colors text-xs flex items-center gap-0.5">
                            <i data-lucide="image" class="w-3 h-3"></i>
                            وێنە
                        </button>
                        <button onclick="fixKurdishScript()" title="چاککردنی پیت و ڕێنووسی کوردی" class="text-indigo-400 hover:text-indigo-300 p-1 transition-colors text-xs flex items-center gap-0.5">
                            <i data-lucide="wand-2" class="w-3 h-3"></i>
                            چاککردن
                        </button>
                        <button onclick="pasteFromClipboard()" title="پەیست" class="text-slate-400 hover:text-purple-300 p-1 transition-colors text-xs flex items-center gap-0.5">
                            <i data-lucide="clipboard" class="w-3 h-3"></i>
                            پەیست
                        </button>
                        <button onclick="clearInput()" title="سڕینەوە" class="text-slate-400 hover:text-rose-400 p-1 transition-colors text-xs flex items-center gap-0.5">
                            <i data-lucide="delete" class="w-3 h-3"></i>
                        </button>
                    </div>
                </div>

                <div id="imagePreviewContainer" class="hidden mb-2 items-center justify-between p-2 bg-slate-800/80 rounded-xl border border-slate-700">
                    <div class="flex items-center gap-2 overflow-hidden">
                        <img id="imagePreview" src="" class="w-9 h-9 object-cover rounded-lg border border-emerald-500/50">
                        <span id="imagePreviewName" class="text-xs text-slate-300 truncate">وێنە دیاریکرا</span>
                    </div>
                    <button onclick="removeAttachedImage()" class="text-slate-400 hover:text-rose-400 p-1">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                </div>

                <textarea id="kurdishInput" rows="3" placeholder="بۆ نموونە: دەستت خۆش بێت..." class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700 text-sm focus:outline-none focus:border-purple-500 text-right"></textarea>
            </div>

            <button onclick="translateText()" id="btnAction" class="w-full py-3.5 bg-gradient-to-r from-purple-600 to-indigo-600 rounded-xl font-bold text-white shadow-lg active:scale-95 transition-all">
                وەرگێڕان بە تێگەیشتنی قووڵ ✦
            </button>

            <div class="mt-5">
                <label id="outputLabel" class="text-xs text-slate-400 block mb-1">ئەنجامی ئینگلیزی (سروشتی):</label>
                <div id="captureArea" class="bg-slate-950 border border-slate-800 rounded-2xl p-4 shadow-inner">
                    <div id="outputBox" dir="ltr" class="w-full min-h-[70px] text-slate-200 text-sm font-sans flex flex-col justify-between gap-3">
                        <div id="resultText" class="text-slate-500 italic leading-relaxed whitespace-pre-wrap">لێرە دەردەکەوێت...</div>
                    </div>

                    <div id="explanationContainer" class="hidden mt-3 pt-3 border-t border-slate-800/80 text-right" dir="rtl">
                        <div class="flex items-center gap-1.5 text-xs text-amber-400 font-semibold mb-1">
                            <i data-lucide="lightbulb" class="w-3.5 h-3.5"></i>
                            <span>تێگەیشتنی مەبەست:</span>
                        </div>
                        <p id="explanationText" class="text-xs text-slate-300 leading-relaxed"></p>
                    </div>

                    <div id="cardWatermark" class="hidden justify-between items-center mt-3 pt-2 border-t border-slate-800/60 text-[10px] text-slate-500" dir="rtl">
                        <span>وەرگێڕی ژیری زمانی کوردی</span>
                        <span class="font-mono text-purple-400">translatekrd.netlify.app</span>
                    </div>
                </div>

                <div id="resultActions" class="hidden items-center justify-between gap-2 pt-3">
                    <div class="flex items-center gap-1.5">
                        <button onclick="shareAsImage()" title="داگرتن وەک کارت بۆ ستۆری" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-emerald-400 rounded-xl border border-slate-700 transition-colors flex items-center gap-1 text-xs">
                            <i data-lucide="camera" class="w-4 h-4"></i>
                            <span class="hidden sm:inline">کارت</span>
                        </button>
                        <button onclick="speakResult()" id="speakBtn" title="گوێگرتن لە دەنگ" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-purple-300 rounded-xl border border-slate-700 transition-colors">
                            <i data-lucide="volume-2" class="w-4 h-4"></i>
                        </button>
                        <button onclick="toggleFavoriteCurrent()" id="favBtn" title="زیادکردن بۆ دڵخوازەکان" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl border border-slate-700 transition-colors">
                            <i data-lucide="star" class="w-4 h-4"></i>
                        </button>
                    </div>

                    <button onclick="copyResult()" id="copyBtn" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3.5 py-2 rounded-xl border border-slate-700 transition-colors flex items-center gap-1.5">
                        <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                        <span id="copyBtnText">کۆپی</span>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <footer class="w-full py-4 text-center text-xs text-slate-500 border-t border-slate-800/40 mt-6 bg-slate-950/60 backdrop-blur-sm">
        <div class="flex items-center justify-center gap-1.5 select-none">
            <span>بەرهەمهێنراوە لەلایەن</span>
            <span class="font-bold text-purple-400">کۆڤان عومەر</span>
            <span class="text-rose-500">❤️</span>
        </div>
    </footer>

    <script>
        let targetLanguage = 'en';
        let currentTone = 'natural';
        let currentTranslationObj = null;
        let attachedImageBase64 = null;
        let attachedImageMime = null;
        let deferredPrompt = null;
        let typeWriterToken = 0;

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            renderHistory();
            renderFavorites();
            checkSavedUser();
            initRealtimePresence();
            initServiceWorker();
        });

        function initRealtimePresence() {
            const FIREBASE_DB_URL = "https://krdtranslator-518d3-default-rtdb.firebaseio.com";
            try {
                if (typeof firebase !== 'undefined' && FIREBASE_DB_URL) {
                    if (!firebase.apps.length) {
                        firebase.initializeApp({ databaseURL: FIREBASE_DB_URL });
                    }
                    const rtdb = firebase.database();
                    const sessionId = 'usr_' + Math.random().toString(36).substring(2, 9);
                    const myRef = rtdb.ref('online_users/' + sessionId);
                    const connectedRef = rtdb.ref('.info/connected');

                    connectedRef.on('value', (snap) => {
                        if (snap.val() === true) {
                            myRef.onDisconnect().remove();
                            myRef.set(Date.now());
                        }
                    });

                    rtdb.ref('online_users').on('value', (snap) => {
                        const count = snap.numChildren();
                        document.getElementById('onlineCount').innerText = `${count > 0 ? count : 1} سەرهێڵ`;
                    });
                    return;
                }
            } catch(e) {
                console.log("Firebase Error:", e);
            }
            document.getElementById('onlineCount').innerText = "١ سەرهێڵ";
        }

        function initServiceWorker() {
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('/sw.js').catch(() => {});
                });
            }
        }

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const pwaBtn = document.getElementById('pwaInstallBtn');
            if (pwaBtn) pwaBtn.classList.remove('hidden');
        });

        function installPWA() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(() => {
                    deferredPrompt = null;
                    document.getElementById('pwaInstallBtn').classList.add('hidden');
                });
            } else {
                alert("بۆ دابەزاندن لەسەر ئایفۆن:\nدەست بنێ بە دوگمەی Share لە خوارەوە، پاشان 'Add to Home Screen' هەڵبژێرە.");
            }
        }

        function escapeHtml(str) {
            if (str == null) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function toggleSidebar() {
            const drawer = document.getElementById('sidebarDrawer');
            const backdrop = document.getElementById('drawerBackdrop');
            const isClosed = drawer.classList.contains('-translate-x-full');
            if (isClosed) {
                drawer.classList.remove('-translate-x-full');
                backdrop.classList.remove('hidden');
            } else {
                drawer.classList.add('-translate-x-full');
                backdrop.classList.add('hidden');
            }
        }

        function switchSidebarTab(tab) {
            const tabHistory = document.getElementById('tabHistory');
            const tabFavorites = document.getElementById('tabFavorites');
            const historyList = document.getElementById('historyList');
            const favoritesList = document.getElementById('favoritesList');
            const historyActions = document.getElementById('historyActions');

            if (tab === 'history') {
                tabHistory.className = "py-1.5 rounded-lg font-medium bg-purple-600/30 text-purple-300 border border-purple-500/30 transition-all";
                tabFavorites.className = "py-1.5 rounded-lg font-medium text-slate-400 hover:text-white transition-all";
                historyList.classList.remove('hidden');
                favoritesList.classList.add('hidden');
                historyActions.classList.remove('hidden');
            } else {
                tabFavorites.className = "py-1.5 rounded-lg font-medium bg-purple-600/30 text-purple-300 border border-purple-500/30 transition-all";
                tabHistory.className = "py-1.5 rounded-lg font-medium text-slate-400 hover:text-white transition-all";
                historyList.classList.add('hidden');
                favoritesList.classList.remove('hidden');
                historyActions.classList.add('hidden');
            }
        }

        function selectTone(tone) {
            currentTone = tone;
            const tones = ['natural', 'formal', 'slang', 'poetic'];
            tones.forEach(t => {
                const btn = document.getElementById(`tone-${t}`);
                if (t === tone) {
                    btn.className = "py-1.5 rounded-lg font-medium bg-purple-600 text-white transition-all";
                } else {
                    btn.className = "py-1.5 rounded-lg font-medium text-slate-400 hover:text-white transition-all";
                }
            });
        }

        function fixKurdishScript() {
            const input = document.getElementById('kurdishInput');
            let t = input.value;
            if (!t) return;
            t = t
                .replace(/ي/g, "ی")
                .replace(/ك/g, "ک")
                .replace(/ڪ/g, "ک")
                .replace(/ى/g, "ی")
                .replace(/ه(?![ەێ])/g, "ە")
                .replace(/[ \t]+/g, " ")
                .trim();
            input.value = t;
        }

        async function pasteFromClipboard() {
            const ta = document.getElementById('kurdishInput');
            try {
                ta.value = await navigator.clipboard.readText();
            } catch (e) {
                ta.focus();
                alert("تکایە بە دەستی پەیست بکە (Ctrl+V یان داگرتن بۆ مێنۆی Paste).");
            }
        }

        function clearInput() {
            document.getElementById('kurdishInput').value = "";
            removeAttachedImage();
        }

        function speakResult() {
            const text = document.getElementById('resultText').textContent;
            if (!text || text.includes('لێرە دەردەکەوێت')) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = targetLanguage === 'en' ? 'en-US' : 'ar-SA';
            window.speechSynthesis.speak(utterance);
        }

        async function shareAsImage() {
            const area = document.getElementById('captureArea');
            const watermark = document.getElementById('cardWatermark');
            watermark.classList.remove('hidden');
            watermark.classList.add('flex');
            try {
                const canvas = await html2canvas(area, { backgroundColor: '#090d16', scale: 2 });
                const link = document.createElement('a');
                link.download = `kurdish-translate-${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            } catch (err) {
                console.error("Image generation failed", err);
                alert("دروستکردنی وێنە سەرکەوتوو نەبوو.");
            } finally {
                watermark.classList.add('hidden');
                watermark.classList.remove('flex');
            }
        }

        function toggleFavoriteCurrent() {
            if (!currentTranslationObj) return;
            let favs = JSON.parse(localStorage.getItem('krd_favorites') || '[]');
            const exists = favs.some(f => f.kurdish === currentTranslationObj.kurdish && f.translated === currentTranslationObj.translated);
            if (exists) {
                favs = favs.filter(f => !(f.kurdish === currentTranslationObj.kurdish && f.translated === currentTranslationObj.translated));
                updateFavIcon(false);
            } else {
                favs.unshift({ id: Date.now(), ...currentTranslationObj });
                updateFavIcon(true);
            }
            localStorage.setItem('krd_favorites', JSON.stringify(favs));
            renderFavorites();
        }

        function updateFavIcon(isFav) {
            const favBtn = document.getElementById('favBtn');
            favBtn.innerHTML = isFav
                ? `<i data-lucide="star" class="w-4 h-4 text-amber-400 fill-amber-400"></i>`
                : `<i data-lucide="star" class="w-4 h-4"></i>`;
            lucide.createIcons();
        }

        function renderFavorites() {
            const list = document.getElementById('favoritesList');
            const favs = JSON.parse(localStorage.getItem('krd_favorites') || '[]');
            if (favs.length === 0) {
                list.innerHTML = `<span class="text-xs text-slate-600 text-center py-6">هیچ دڵخوازێک تۆمار نەکراوە ⭐</span>`;
                return;
            }
            list.innerHTML = favs.map(item => `
                <div class="flex items-center justify-between p-2.5 bg-slate-900/60 hover:bg-slate-800/80 rounded-xl border border-slate-800 transition-all text-xs">
                    <div onclick="fillFromCustom('${encodeURIComponent(item.kurdish)}', '${encodeURIComponent(item.translated)}', '${encodeURIComponent(item.explanation || '')}')" class="flex-1 cursor-pointer overflow-hidden pl-2">
                        <div class="font-medium text-amber-300 truncate">${escapeHtml(item.kurdish)}</div>
                        <div class="text-[11px] text-slate-300 truncate mt-0.5" dir="${item.lang === 'en' ? 'ltr' : 'rtl'}">${escapeHtml(item.translated)}</div>
                    </div>
                    <button onclick="removeFavorite(${item.id})" class="p-1.5 text-slate-500 hover:text-rose-400 transition-colors">
                        <i data-lucide="trash" class="w-3.5 h-3.5"></i>
                    </button>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function removeFavorite(id) {
            let favs = JSON.parse(localStorage.getItem('krd_favorites') || '[]');
            favs = favs.filter(f => f.id !== id);
            localStorage.setItem('krd_favorites', JSON.stringify(favs));
            renderFavorites();
            if (currentTranslationObj) {
                updateFavIcon(favs.some(f => f.kurdish === currentTranslationObj.kurdish));
            }
        }

        function fillFromCustom(kurdishEncoded, transEncoded, explanationEncoded) {
            const kurdish = decodeURIComponent(kurdishEncoded);
            const translated = decodeURIComponent(transEncoded);
            const explanation = decodeURIComponent(explanationEncoded || '');

            document.getElementById('kurdishInput').value = kurdish;
            const resultText = document.getElementById('resultText');
            resultText.textContent = translated;
            resultText.classList.remove('text-slate-500', 'italic', 'text-rose-400');
            resultText.classList.add('text-white');

            const expContainer = document.getElementById('explanationContainer');
            if (explanation) {
                document.getElementById('explanationText').textContent = explanation;
                expContainer.classList.remove('hidden');
            } else {
                expContainer.classList.add('hidden');
            }

            document.getElementById('resultActions').classList.remove('hidden');
            document.getElementById('resultActions').classList.add('flex');
            currentTranslationObj = { kurdish, translated, explanation, lang: targetLanguage };
            toggleSidebar();
        }

        function typeWriter(text, elementId) {
            const token = ++typeWriterToken;
            const element = document.getElementById(elementId);
            element.textContent = "";
            let i = 0;
            const speed = 15;
            (function typing() {
                if (token !== typeWriterToken) return;
                if (i < text.length) {
                    element.textContent += text.charAt(i);
                    i++;
                    setTimeout(typing, speed);
                }
            })();
        }

        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                return JSON.parse(decodeURIComponent(escape(window.atob(base64))));
            } catch (e) {
                return null;
            }
        }

        function handleCredentialResponse(response) {
            const user = parseJwt(response.credential);
            if (user) {
                localStorage.setItem('krd_user', JSON.stringify({ name: user.name, picture: user.picture }));
                showUser(user.name, user.picture);
            }
        }

        function checkSavedUser() {
            const saved = localStorage.getItem('krd_user');
            if (saved) {
                try {
                    const user = JSON.parse(saved);
                    showUser(user.name, user.picture);
                } catch(e) {}
            }
        }

        function showUser(name, pic) {
            document.getElementById('userName').innerText = name;
            const avatar = document.getElementById('userAvatar');
            avatar.src = pic;
            avatar.onerror = () => { avatar.style.display = 'none'; };
            document.getElementById('userInfo').classList.remove('hidden');
            document.getElementById('userInfo').classList.add('flex');
            document.getElementById('googleAuthBox').classList.add('hidden');

            const topIcon = document.getElementById('topUserIcon');
            const topImg = document.getElementById('topAvatarImg');
            topImg.src = pic;
            topImg.onerror = () => { topIcon.classList.add('hidden'); };
            topIcon.classList.remove('hidden');
        }

        function logoutGoogle() {
            localStorage.removeItem('krd_user');
            document.getElementById('userInfo').classList.add('hidden');
            document.getElementById('userInfo').classList.remove('flex');
            document.getElementById('googleAuthBox').classList.remove('hidden');
            document.getElementById('topUserIcon').classList.add('hidden');
            document.getElementById('userAvatar').src = "";
            document.getElementById('topAvatarImg').src = "";
        }

        function saveToHistory(kurdish, translated, explanation, lang) {
            let history = JSON.parse(localStorage.getItem('krd_history') || '[]');
            history.unshift({ id: Date.now(), kurdish, translated, explanation, lang });
            if (history.length > 25) history.pop();
            localStorage.setItem('krd_history', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const historyList = document.getElementById('historyList');
            const history = JSON.parse(localStorage.getItem('krd_history') || '[]');
            if (history.length === 0) {
                historyList.innerHTML = `<span class="text-xs text-slate-600 text-center py-6">هیچ مێژوویەک تۆمار نەکراوە</span>`;
                return;
            }
            historyList.innerHTML = history.map((item, idx) => `
                <div class="flex items-center justify-between p-2.5 bg-slate-900/60 hover:bg-slate-800/80 rounded-xl border border-slate-800 transition-all text-xs">
                    <div onclick="fillFromHistory(${idx})" class="flex-1 cursor-pointer overflow-hidden pl-2">
                        <div class="font-medium text-slate-200 truncate">${escapeHtml(item.kurdish)}</div>
                        <div class="text-[11px] text-purple-300/80 truncate mt-0.5" dir="${item.lang === 'en' ? 'ltr' : 'rtl'}">${escapeHtml(item.translated)}</div>
                    </div>
                    <button onclick="deleteSingleHistory(${item.id}, event)" title="سڕینەوە" class="opacity-70 hover:opacity-100 p-1.5 text-slate-500 hover:text-rose-400 transition-opacity flex-shrink-0">
                        <i data-lucide="trash" class="w-3.5 h-3.5"></i>
                    </button>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function deleteSingleHistory(id, event) {
            event.stopPropagation();
            let history = JSON.parse(localStorage.getItem('krd_history') || '[]');
            history = history.filter(item => item.id !== id);
            localStorage.setItem('krd_history', JSON.stringify(history));
            renderHistory();
        }

        function fillFromHistory(index) {
            const history = JSON.parse(localStorage.getItem('krd_history') || '[]');
            if (history[index]) {
                const item = history[index];
                document.getElementById('kurdishInput').value = item.kurdish;
                const resultText = document.getElementById('resultText');
                resultText.textContent = item.translated;
                resultText.classList.remove('text-slate-500', 'italic', 'text-rose-400');
                resultText.classList.add('text-white');

                const expContainer = document.getElementById('explanationContainer');
                if (item.explanation) {
                    document.getElementById('explanationText').textContent = item.explanation;
                    expContainer.classList.remove('hidden');
                } else {
                    expContainer.classList.add('hidden');
                }

                document.getElementById('resultActions').classList.remove('hidden');
                document.getElementById('resultActions').classList.add('flex');
                currentTranslationObj = item;
                toggleSidebar();
            }
        }

        function clearHistory() {
            localStorage.removeItem('krd_history');
            renderHistory();
        }

        function selectLang(lang) {
            targetLanguage = lang;
            const btnEn = document.getElementById('btn-en');
            const btnAr = document.getElementById('btn-ar');
            const outputBox = document.getElementById('outputBox');
            const outputLabel = document.getElementById('outputLabel');

            if (lang === 'en') {
                btnEn.className = "py-2 rounded-xl text-sm font-semibold transition-all bg-purple-600 text-white shadow";
                btnAr.className = "py-2 rounded-xl text-sm font-semibold transition-all text-slate-400 hover:text-white";
                outputBox.dir = "ltr";
                outputLabel.innerText = "ئەنجامی ئینگلیزی (سروشتی):";
            } else {
                btnAr.className = "py-2 rounded-xl text-sm font-semibold transition-all bg-purple-600 text-white shadow";
                btnEn.className = "py-2 rounded-xl text-sm font-semibold transition-all text-slate-400 hover:text-white";
                outputBox.dir = "rtl";
                outputLabel.innerText = "ئەنجامی عەرەبی (سروشتی):";
            }
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (!file.type.startsWith('image/')) {
                alert("تەنها فایلی وێنە ڕێگەپێدراوە.");
                event.target.value = "";
                return;
            }
            if (file.size > 10 * 1024 * 1024) {
                alert("وێنەکە زۆر گەورەیە، تکایە کەمتر لە ١٠ مێگابایت هەڵبژێرە.");
                event.target.value = "";
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const fullBase64 = e.target.result;
                downscaleImage(fullBase64, 1200).then(({ base64, mime }) => {
                    attachedImageBase64 = base64;
                    attachedImageMime = mime;
                    document.getElementById('imagePreview').src = fullBase64;
                    document.getElementById('imagePreviewName').innerText = file.name || "وێنەی هەڵبژێردراو";
                    const container = document.getElementById('imagePreviewContainer');
                    container.classList.remove('hidden');
                    container.classList.add('flex');
                });
            };
            reader.readAsDataURL(file);
        }

        function downscaleImage(dataUrl, maxWidth = 1200) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const ratio = Math.min(1, maxWidth / img.width);
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.round(img.width * ratio);
                    canvas.height = Math.round(img.height * ratio);
                    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                    resolve({
                        base64: canvas.toDataURL('image/jpeg', 0.85).split(',')[1],
                        mime: 'image/jpeg'
                    });
                };
                img.onerror = () => resolve({ base64: null, mime: null });
                img.src = dataUrl;
            });
        }

        function removeAttachedImage() {
            attachedImageBase64 = null;
            attachedImageMime = null;
            document.getElementById('imageInput').value = "";
            const container = document.getElementById('imagePreviewContainer');
            container.classList.add('hidden');
            container.classList.remove('flex');
        }

        async function requestModel(partsPayload) {
            const res = await fetch('/api/translate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ parts: partsPayload })
            });
            const data = await res.json().catch(() => null);
            if (!res.ok) throw new Error((data && data.error) || `HTTP ${res.status}`);
            return data;
        }

        async function translateText() {
            let text = document.getElementById('kurdishInput').value.trim();
            const resultText = document.getElementById('resultText');
            const resultActions = document.getElementById('resultActions');
            const expContainer = document.getElementById('explanationContainer');
            const expText = document.getElementById('explanationText');
            const btn = document.getElementById('btnAction');

            if (!text && !attachedImageBase64) {
                alert("تکایە دەقێک بنووسە یان وێنەیەک هەڵبژێرە!");
                return;
            }

            btn.innerText = "خەریکی وەرگێڕانە...";
            btn.disabled = true;

            const promptText = `You are a master Kurdish linguist and translator.
Target Language: ${targetLanguage === 'en' ? 'English' : 'Arabic'}.
Requested Tone: ${currentTone} (options: natural, formal, slang, poetic).
${text ? `Kurdish Input: "${text}"` : 'Please carefully extract and transcribe the Kurdish text from the provided image and translate it.'}

Respond in valid JSON ONLY with this schema:
{
  "extracted_kurdish": "The extracted or original Kurdish text",
  "translation": "The idiomatic translation in the requested tone and target language",
  "explanation": "A very concise 1-sentence Kurdish explanation of the underlying meaning, cultural context, or metaphor of this phrase"
}`;

            const parts = [{ text: promptText }];
            if (attachedImageBase64) {
                parts.unshift({
                    inlineData: {
                        mimeType: attachedImageMime || 'image/jpeg',
                        data: attachedImageBase64
                    }
                });
            }

            try {
                let parsedResult = null;
                let lastError = null;

                try {
                    const data = await requestModel(parts);
                    const raw = data?.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (!raw) throw new Error("وەڵامی بەتاڵ لە مۆدێلەکەوە");
                    parsedResult = JSON.parse(raw);
                } catch (e) {
                    lastError = e.message;
                }

                if (parsedResult && parsedResult.translation) {
                    if (parsedResult.extracted_kurdish && !text) {
                        text = parsedResult.extracted_kurdish;
                        document.getElementById('kurdishInput').value = text;
                    }

                    resultText.classList.remove('text-slate-500', 'italic', 'text-rose-400');
                    resultText.classList.add('text-white');
                    typeWriter(parsedResult.translation, 'resultText');

                    if (parsedResult.explanation) {
                        expText.textContent = parsedResult.explanation;
                        expContainer.classList.remove('hidden');
                    } else {
                        expContainer.classList.add('hidden');
                    }

                    resultActions.classList.remove('hidden');
                    resultActions.classList.add('flex');

                    currentTranslationObj = {
                        kurdish: text || "وەرگێڕان لە وێنەوە",
                        translated: parsedResult.translation,
                        explanation: parsedResult.explanation || '',
                        lang: targetLanguage
                    };
                    updateFavIcon(false);
                    saveToHistory(text || "وەرگێڕان لە وێنەوە", parsedResult.translation, parsedResult.explanation, targetLanguage);

                    if (typeof gtag === 'function') {
                        gtag('event', 'translate_action', { 'target_lang': targetLanguage, 'tone': currentTone });
                    }
                } else if (lastError) {
                    resultText.classList.remove('text-white', 'italic');
                    resultText.classList.add('text-rose-400');
                    resultText.textContent = "هەڵە: " + lastError;
                } else {
                    resultText.classList.remove('text-white', 'italic');
                    resultText.classList.add('text-rose-400');
                    resultText.textContent = "وەڵامێکی دروست نەگەڕایەوە، تکایە دووبارە هەوڵبدەرەوە.";
                }
            } catch (err) {
                resultText.classList.remove('text-white', 'italic');
                resultText.classList.add('text-rose-400');
                resultText.textContent = "کێشەیەک لە پەیوەندی هەیە: " + err.message;
            } finally {
                btn.innerText = "وەرگێڕان بە تێگەیشتنی قووڵ ✦";
                btn.disabled = false;
                lucide.createIcons();
            }
        }

        function copyResult() {
            const text = document.getElementById('resultText').textContent;
            navigator.clipboard.writeText(text);
            const copyBtnText = document.getElementById('copyBtnText');
            copyBtnText.innerText = "کۆپی کرا!";
            setTimeout(() => { copyBtnText.innerText = "کۆپی"; }, 2000);
        }
    </script>
